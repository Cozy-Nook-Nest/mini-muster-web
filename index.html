<title>Mini Muster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column phone app — sticky header with two tabs (Shelf / Encounter), cards below, bottom sheet for editing. */
:root{
  --bg:#eceae6; --surface:#f8f7f4; --ink:#22231f; --muted:#6a6b63; --line:#d3d1ca;
  --accent:#9a5b16; --accent-ink:#fff; --primer:#3b3d39;
  --ok:#2f7a45; --warn:#b06a08; --bad:#b03a2e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171816; --surface:#22231f; --ink:#ecebe5; --muted:#9d9e95; --line:#3a3b36;
  --accent:#e0a050; --accent-ink:#1b1206; --primer:#c9cac2;
  --ok:#6cc488; --warn:#e8a63c; --bad:#ec7a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171816; --surface:#22231f; --ink:#ecebe5; --muted:#9d9e95; --line:#3a3b36;
  --accent:#e0a050; --accent-ink:#1b1206; --primer:#c9cac2;
  --ok:#6cc488; --warn:#e8a63c; --bad:#ec7a6c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand .count{margin-left:auto;text-align:right}
.gear{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.gear:hover{color:var(--ink);background:var(--surface)}
.stages.three{grid-template-columns:repeat(3,1fr)}
.stagepick.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2.three>label{min-width:0}
.grid2.three input{min-width:0;width:100%}
.setting{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.setting>b{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#s-counts{display:grid;gap:10px}
.countrow{display:grid;gap:4px}
.stagepick.countpick{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stagepick.countpick.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stagepick.countpick button{min-width:0;padding:8px 0;font-size:11px;letter-spacing:0}
.countrow>span{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.switchrow{display:flex!important;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;font:15px var(--body)!important}
.switchrow>span{display:grid;gap:3px;min-width:0}
.switchrow small{font-size:13px;color:var(--muted);line-height:1.4}
input[role="switch"]{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
input[role="switch"]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .15s}
input[role="switch"]:checked{background:var(--accent)}
input[role="switch"]:checked::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){input[role="switch"],input[role="switch"]::after{transition:none}}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.count{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-block:14px}
.toolbar>*{min-width:0}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.list{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.base{width:40px;height:40px;display:grid;place-items:center}
.base span{display:block;border-radius:50%;background:var(--primer);opacity:.85}
.base.photo{width:48px;height:48px;padding:0;border:1px solid var(--line);border-radius:50%;overflow:hidden;background:var(--bg);cursor:zoom-in}
.base.photo img{width:100%;height:100%;object-fit:cover;display:block}
.base.photo .fallback{display:none}
.base.photo.broken{border-style:dashed;cursor:default;display:grid;place-items:center}
.base.photo.broken .fallback{display:block}
.photofield{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pthumb{width:72px;height:72px;border-radius:50%;overflow:hidden;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb span{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.pctl{display:grid;gap:4px;min-width:0}
.note a{color:var(--accent);font-weight:700}
.pctl label.btn{display:inline-flex;align-items:center;font:700 15px var(--body);text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}

.viewer{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);background:var(--bg);border-radius:14px;padding:12px;display:grid;gap:10px}
.viewer img{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--surface)}
.mini .info{min-width:0}
.mini .name{font-weight:700;overflow-wrap:anywhere}
.mini .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qty{font:700 20px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.stage{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--display);letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--ink);margin-top:4px}

.s-primed i{background:var(--primer)}

.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.seg{display:grid;gap:1px;justify-items:start;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;text-align:left;min-width:0}
.seg b{font:700 17px var(--display);font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.seg small{display:flex;align-items:center;gap:4px;font:600 10.5px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.mini{grid-template-columns:auto 1fr auto}

.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}

.stagepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stagepick button{min-width:0}
.stagepick button{padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:600 13px var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.stagepick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stagepick button:disabled{opacity:.35;cursor:default}
.sorts{display:grid;gap:6px}
.sortrow{display:grid;grid-template-columns:72px 1fr auto auto;gap:6px;align-items:center}
.sortrow .lbl{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fpanel .sortrow select{width:auto;}
.sortrow select{min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sortrow button{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:700 13px var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.addsort{justify-self:start;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
details.enc{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.enc>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:12px}
details.enc>summary::-webkit-details-marker{display:none}
details.enc>summary::after{content:"";grid-column:3;grid-row:2;justify-self:end;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px}
details.enc[open]>summary::after{transform:rotate(-135deg)}
details.enc[open]>summary{border-bottom:1px solid var(--line)}
.enc-dot{width:10px;height:10px;border-radius:50%;grid-row:1 / 3;background:var(--bad)}
.enc-dot.ok{background:var(--ok)}.enc-dot.short{background:var(--warn)}
.enc-name{font:700 18px var(--display);letter-spacing:.03em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.enc-sum{font:700 14px var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.enc-sub{grid-column:2;font-size:13px;color:var(--muted)}
.enc-body{padding:12px;display:grid;gap:10px}
label.check{display:flex;align-items:center;gap:8px;font:15px var(--body);text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}

.campedit{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.searchrow .search{min-width:0}

.filterbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}

.group{font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.group>span:first-child{min-width:0}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.note{font-size:13px;color:var(--muted)}
/* encounter */
textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical}
h2{font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 8px}
.res{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.res.ok{border-left-color:var(--ok)} .res.short{border-left-color:var(--warn)} .res.none{border-left-color:var(--bad)}
.res .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.res .need{font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere;min-width:0}
.res .tally{font:700 15px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ok-t{color:var(--ok)} .short-t{color:var(--warn)} .none-t{color:var(--bad)}
.queue{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-variant-numeric:tabular-nums}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:14px 14px 0 0;max-height:90%;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet form{max-width:600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sheet form>*{min-width:0}
label{display:grid;gap:4px;font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label input,label select,label textarea{width:100%;min-width:0;max-width:100%;font:15px var(--body);color:var(--ink);text-transform:none;letter-spacing:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2>label{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-weight:700}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}

<script>
const STAGES=["file","printed","primed","painted"];
/* Settings. "Track 3D print files" syncs with the account; the theme is per device. */
let showFile=true;try{showFile=localStorage.getItem("showFile")!=="0"}catch{}
let themePref="system";try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")themePref=t}catch{}
const VIS=()=>showFile?STAGES:STAGES.slice(1);
/* Bookmarks: a flag on each mini / encounter (synced), plus a per-device "show bookmarked only" toggle per tab. */
const BM_ICON=on=>`<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
let bmShelf=false,bmEnc=false;try{bmShelf=localStorage.getItem("bmShelf")==="1";bmEnc=localStorage.getItem("bmEnc")==="1"}catch{}
// Header counts: each counts minis at the chosen stage and later ones.
let countTotal="file",countReady="printed";
const COUNT_VALS=[...STAGES,"off"];
try{const c=JSON.parse(localStorage.getItem("countPrefs")||"{}");if(COUNT_VALS.includes(c.total))countTotal=c.total;if(COUNT_VALS.includes(c.ready))countReady=c.ready}catch{}
const effStage=v=>v==="off"||VIS().includes(v)?v:VIS()[0];
const sumFrom=(m,v)=>VIS().slice(VIS().indexOf(effStage(v))).reduce((a,s)=>a+m.counts[s],0);
const STAGE_LABEL={file:"File only",printed:"Printed",primed:"Primed",painted:"Painted"};
const STAGE_SHORT={file:"File",printed:"Printed",primed:"Primed",painted:"Painted"};
const SIZES={Tiny:20,Small:25,Medium:25,Large:50,Huge:75,Gargantuan:100};
const TYPES=["aberration","beast","celestial","construct","dragon","elemental","fey","fiend","giant","humanoid","monstrosity","ooze","plant","undead"];
const CRS=["0","1/8","1/4","1/2",...Array.from({length:30},(_,i)=>String(i+1))];
const crNum=c=>c==null||c===""?Infinity:(String(c).includes("/")?(([a,b])=>a/b)(String(c).split("/").map(Number)):Number(c));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const SORT_OPTS={name:"Name",cr:"Challenge rating",type:"Creature type"};
const DIR_LABEL={name:["A–Z","Z–A"],cr:["Low first","High first"],type:["A–Z","Z–A"]};
let sorts=[{k:"name",desc:false}],typeFilter="all",crMin="",crMax="";
let minis=[]; let db=null; let col=null; let assets=null; let stageFilter="all";
let quick=false;try{quick=localStorage.getItem("quickCounts")==="1"}catch{}
const pending={},pendTimer={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}

/* Each mini keeps a count per stage. Older rows stored one qty + one stage; read those as a single-stage count. */
function normalize(m){
  const counts={file:0,printed:0,primed:0,painted:0};
  if(m.counts&&typeof m.counts==="object"){for(const s of STAGES)counts[s]=Math.max(0,parseInt(m.counts[s])||0)}
  else if(m.stage&&STAGES.includes(m.stage)){counts[m.stage]=Math.max(0,parseInt(m.qty)||0)}
  return {id:m.id,cr:CRS.includes(String(m.cr))?String(m.cr):"",type:TYPES.includes(m.type)?m.type:"",name:m.name||"Unnamed",size:SIZES[m.size]?m.size:"Medium",tags:Array.isArray(m.tags)?m.tags:[],notes:typeof m.notes==="string"?m.notes:"",photo:/^([0-9a-f]{32}|lp_[a-z0-9]+)$/i.test(m.photo||"")?m.photo:"",bookmarked:m.bookmarked===true,example:!!m.example,counts};
}
const total=m=>VIS().reduce((a,s)=>a+m.counts[s],0);
const readyCount=m=>m.counts.printed+m.counts.primed+m.counts.painted;

/* ---- storage: synced to the account when available, this browser otherwise ---- */
function localLoad(){try{minis=JSON.parse(localStorage.getItem("minis")||"[]").map(normalize)}catch{minis=[]}}
// Downloaded copy: say so if the browser refuses to store (full or blocked), instead of losing changes quietly.
function storeLocal(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true}catch{toast("Couldn't save. This browser's storage is full or turned off.");return false}}
function localSave(){storeLocal("minis",minis)}
async function saveMini(m){
  const body={name:m.name,cr:m.cr||"",type:m.type||"",size:m.size,tags:m.tags,notes:m.notes||"",photo:m.photo||"",bookmarked:!!m.bookmarked,counts:{...m.counts},updated:Date.now()};
  if(m.example)body.example=true;
  if(col){try{await col.doc(m.id).set(body)}catch(e){toast(e&&e.code==="quota_exceeded"?"Shelf is full. Remove some minis first.":"Couldn't save. Try again.")}}
  else{const n=normalize({id:m.id,...body});const i=minis.findIndex(x=>x.id===m.id);if(i<0)minis.push(n);else minis[i]=n;localSave();render();renderEncounters()}
}
async function removeMini(id){
  const old=minis.find(x=>x.id===id);if(old?.photo)dropPhoto(old.photo);
  if(col){try{await col.doc(id).delete()}catch{toast("Couldn't remove. Try again.")}}
  else{minis=minis.filter(x=>x.id!==id);localSave();render();renderEncounters()}
}
function newId(){return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---- shelf ---- */
function render(){
  const all=minis.reduce((a,m)=>a+total(m),0);
  const ready=minis.reduce((a,m)=>a+sumFrom(m,countReady),0);
  const shownTotal=minis.reduce((a,m)=>a+sumFrom(m,countTotal),0);
  const parts=[];if(countReady!=="off")parts.push(`${ready} ready`);if(countTotal!=="off")parts.push(`${shownTotal} total`);

/* Quick counts: +/− change a stage count on the card itself. Taps show instantly and save

function bump(id,st,d,btn){

  render();renderEncounters();

  clearTimeout(pendTimer[id]);

    if(!alt){openSheet(m);return} from=alt}

  sheetShell("Move minis",`
    <h2 style="margin:0">Move ${esc(m.name)}</h2>
    <label>From</label><div class="stagepick${showFile?"":" three"}" id="mv-from"></div>

    const max=m.counts[from];n=Math.min(Math.max(1,n),max);
    $("mv-from").innerHTML=V.map(s=>`<button type="button" data-v="${s}" aria-pressed="${s===from}" ${m.counts[s]?"":"disabled"}>${STAGE_SHORT[s]} ${m.counts[s]}</button>`).join("");
    $("mv-to").innerHTML=V.map(s=>`<button type="button" data-v="${s}" aria-pressed="${s===to}" ${s===from?"disabled":""}>${STAGE_SHORT[s]}</button>`).join("");

}

/* ---- photos ----
   Phone photos are big, so each one is shrunk to fit 640px before upload. Only the
   asset id is saved on the mini; the image is served from the artifact's own storage. */
async function shrinkImage(file,max=640){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
    if(!blob)throw new Error("encode");return blob;
  }finally{URL.revokeObjectURL(url)}
}
const PHOTO_ERR={too_large:"That photo is too big. Try a smaller one.",unsupported_type:"That file type isn't supported. Use a JPG, PNG or WebP photo.",
  quota_or_state:"Photo storage is full. Remove some photos first.",rate_limited:"Too many uploads at once. Wait a moment and try again.",
  upstream_auth:"Couldn't upload. Reload the page or sign in again."};

  if(NATIVE){nativePhotos=true;(NATIVE.photos||[]).forEach(id=>localUrls.set(id,"photos/"+id+".jpg"));return}
  try{const open=indexedDB.open("mini-muster",1);open.onupgradeneeded=()=>open.result.createObjectStore("photos");idb=await idbReq(open);
    const st=idb.transaction("photos").objectStore("photos");const [keys,vals]=await Promise.all([idbReq(st.getAllKeys()),idbReq(st.getAll())]);

async function localPhotoSave(blob){

  $("f").addEventListener("paste",ev=>{if(ev.target.id==="f-notes")return;const r=parseStatBlock(ev.clipboardData?.getData("text"));if(!r)return;ev.preventDefault();
    $("f-name").value=r.name;if(r.size)$("f-size").value=r.size;if(r.type)$("f-type").value=r.type;if(r.cr)$("f-cr").value=r.cr;

/* ---- encounters ---- */
// Table-ready threshold: the lowest stage that counts toward an encounter.
const READY_OPTS=[["file","All stages"],["printed","Printed+"],["primed","Primed+"],["painted","Painted only"]];
let readyFrom="printed";try{const r=localStorage.getItem("readyFrom");if(READY_OPTS.some(o=>o[0]===r))readyFrom=r}catch{}
const effReady=()=>VIS().includes(readyFrom)?readyFrom:VIS()[0];
const countsFor=m=>VIS().slice(VIS().indexOf(effReady())).reduce((a,s)=>a+m.counts[s],0);
const belowFor=m=>VIS().slice(0,VIS().indexOf(effReady())).reduce((a,s)=>a+m.counts[s],0);
let encounters=[];let encCol=null;const openEnc=new Set();

function parseLines(txt){return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+)\s*[x×]?\s+(.+)$/i);return m?{n:+m[1],what:m[2].trim()}:{n:1,what:l}})}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/s\b/g,"").trim();
/* Matching rules:
   - exact name or exact "stand in for" tag always counts
   - a tag that is a creature type (beast, undead…) matches any monster of that type, and never by name
   - partial word matches (tag "wolf" for "dire wolf") only count when the mini's type matches the monster's,
     unless the mini's tags list the monster's type explicitly */
const hasWords=(a,b)=>!!b&&(" "+a+" ").includes(" "+b+" ");
const typeWord=t=>TYPES.includes(t);
function inferType(what){const w=norm(what);return minis.find(m=>m.type&&norm(m.name)===w)?.type||""}
function matches(m,what,T){
  const w=norm(what);const name=norm(m.name);const tags=m.tags.map(norm);
  if(name===w||tags.some(t=>!typeWord(t)&&t===w))return true;
  if(T&&tags.some(t=>typeWord(t)&&t===T))return true;
  const partial=hasWords(name,w)||hasWords(w,name)||tags.some(t=>!typeWord(t)&&(hasWords(t,w)||hasWords(w,t)));
  if(!partial)return false;
  if(T&&m.type&&m.type!==T&&!tags.includes(T))return false;
  return true;
}

/* D&D Beyond encounter paste: blocks of Name / "Size Type" / CR:x / XP:n, with an optional count line after a block. */
/* A monster stat block copied from D&D Beyond (2014 "Challenge 1/4 (50 XP)" or 2024 "CR 1/4 (XP 50; PB +2)" styles). */
function parseStatBlock(text){
  const L=String(text||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(L.length<2)return null;
  const firstWord=(s,list)=>{let best="",at=1e9;for(const w of list){const m=new RegExp("\\b"+w.toLowerCase()+"\\b").exec(s.toLowerCase());if(m&&m.index<at){at=m.index;best=w}}return best};
  const st=L.findIndex(l=>l.length<90&&firstWord(l,Object.keys(SIZES))&&firstWord(l,TYPES));
  if(st<0)return null;
  let name=st>0?L[st-1]:"";
  if(!name||/^(monsters?|stat block)$/i.test(name))return null;
  name=name.replace(/\s*\(legacy\)\s*$/i,"").replace(/\s+/g," ");
  const all=L.join("\n");
  const crm=all.match(/\bChallenge(?:\s+Rating)?\s*:?\s*(\d+(?:\/\d+)?)/i)||all.match(/\bCR\s*:?\s*(\d+(?:\/\d+)?)/i);
  const cr=crm&&CRS.includes(crm[1])?crm[1]:"";
  return {name,size:firstWord(L[st],Object.keys(SIZES)),type:firstWord(L[st],TYPES),cr};
}

const looksLikeStatBlock=t=>/\b(AC|Armor Class)\b/.test(t)&&/\b(HP|Hit Points)\b/.test(t);
// Encounter box accepts a D&D Beyond encounter list, or a single stat block (counted as 1).
function parseEncounterPaste(t){
  const d=parseDDB(t);if(d)return d;
  const s=parseStatBlock(t);if(!s)return null;
  return {lines:`1 ${s.name}`,meta:{[norm(s.name)]:{name:s.name,size:s.size,type:s.type,cr:s.cr}},count:1,stat:true,name:s.name};
}
// Add pasted lines to what's already typed; the same creature again raises its count instead of repeating the line.
function mergeLines(existing,add){
  const cur=parseLines(existing);
  for(const x of parseLines(add)){const hit=cur.find(c=>norm(c.what)===norm(x.what));if(hit)hit.n+=x.n;else cur.push({...x})}
  return cur.map(c=>`${c.n} ${c.what}`).join("\n");
}

function parseDDB(text){
  const raw=String(text||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  // Some copies put "CR:" / "XP:" on their own line with the value below; rejoin them.
  const L=[];for(let k=0;k<raw.length;k++){if(/^(CR|XP)\s*:?$/i.test(raw[k])&&raw[k+1]&&/^[\d.,]+(\/\d+)?$/.test(raw[k+1])){L.push(raw[k].replace(/\s*:?$/,":")+raw[k+1]);k++}else L.push(raw[k])}
  const crIdx=L.map((l,i)=>/^CR\s*:?\s*\d+(\/\d+)?$/i.test(l)?i:-1).filter(i=>i>=0);
  if(!crIdx.length||!L.some(l=>/^XP\s*:/i.test(l)))return null;
  const out=[];
  for(const i of crIdx){
    const name=L[i-2],st=L[i-1]||"";if(!name||/^monsters?$/i.test(name))continue;
    const low=st.toLowerCase();
    const size=Object.keys(SIZES).find(s=>new RegExp("\\b"+s.toLowerCase()+"\\b").test(low))||"";
    const type=TYPES.find(t=>new RegExp("\\b"+t+"\\b").test(low))||"";
    const cr=(L[i].match(/(\d+(?:\/\d+)?)/)||[])[1]||"";
    let j=i+1;if(L[j]&&/^XP\s*:/i.test(L[j]))j++;
    const n=L[j]&&/^\d+$/.test(L[j])?Math.max(1,+L[j]):1;
    out.push({name,n,size,type,cr:CRS.includes(cr)?cr:""});
  }
  if(!out.length)return null;
  const meta={};for(const m of out)meta[norm(m.name)]={name:m.name,size:m.size,type:m.type,cr:m.cr};
  return {lines:out.map(m=>`${m.n} ${m.name}`).join("\n"),meta,count:out.length};
}

function checkEncounter(e){
  const need=parseLines(e.lines);const queue=[];let covered=0,anyHave=false;
  const rows=need.map(({n,what})=>{
    const T=(e.meta&&e.meta[norm(what)]?.type)||inferType(what);
    const hits=minis.filter(m=>matches(m,what,T));
    const have=hits.reduce((a,m)=>a+countsFor(m),0);
    const notYet=hits.reduce((a,m)=>a+belowFor(m),0);
    const cls=have>=n?"ok":have>0?"short":"none";if(have>=n)covered++;if(have>0)anyHave=true;
    const short=Math.max(0,n-have);
    if(short){
      if(!hits.length)queue.push(`${short}× ${what} (need ${short} mini${short===1?"":"s"})`);
      else{
        // Where the matching minis sit: each stage below the table-ready level, then how many already count.
        const V=VIS(),r=effReady(),at=s=>hits.reduce((a,m)=>a+m.counts[s],0);
        const below=V.slice(0,V.indexOf(r)).filter(s=>at(s)).map(s=>`${at(s)} ${s}`);
        const readyLbl={file:"on shelf",printed:"printed+",primed:"primed+",painted:"painted"}[r];
        const parts=[...below,...(have?[`${have} ${readyLbl}`]:[])];
        queue.push(`${short}× ${what} (need ${short} more${parts.length?"; "+parts.join(", "):""})`)}}
    const detail=hits.length?hits.map(m=>{const parts=VIS().filter(s=>m.counts[s]).map(s=>`${m.counts[s]} ${STAGE_SHORT[s].toLowerCase()}`);
      return `${esc(m.name)} <span class="note">(${parts.join(", ")||"none"})</span>`}).join(" · "):"Nothing on your shelf is tagged for this.";
    const info=e.meta&&e.meta[norm(what)];
    const infoLine=info?`<div class="note">${[info.cr?"CR "+esc(info.cr):"",[info.size,info.type?cap(info.type):""].filter(Boolean).map(esc).join(" ")].filter(Boolean).join(" · ")}</div>`:"";
    const addBtn=!hits.length?`<div><button class="btn sm" type="button" data-addmini="${e.id}" data-what="${esc(what)}">+ Add to shelf</button></div>`:"";
    return `<div class="res ${cls}"><div class="top"><span class="need">${n}× ${esc(what)}</span>
      <span class="tally ${cls}-t">${have>=n?"Covered":have>0?`${have} of ${n}`:"Missing"}</span></div><div class="meta">${detail}</div>${infoLine}${addBtn}</div>`});
  return {need,rows,queue,covered,anyHave};
}

// Encounters store a campaign id, so renaming a campaign updates every encounter filed under it.
let campaigns=[];let campCol=null;let encSort="new",campFilter="all";
try{const s=localStorage.getItem("encSort");if(["new","old","name","camp"].includes(s))encSort=s}catch{}
const campById=id=>campaigns.find(c=>c.id===id);
const campName=e=>campById(e.campaignId)?.name||"";
const autoCamp=()=>campaigns.find(c=>c.autofill);
const byCampName=(a,b)=>a.name.localeCompare(b.name);
function localCampLoad(){try{campaigns=JSON.parse(localStorage.getItem("campaigns")||"[]")}catch{campaigns=[]}}
function localCampSave(){storeLocal("campaigns",campaigns)}
async function saveCamp(c){
  const body={name:c.name,autofill:!!c.autofill,created:c.created||Date.now()};
  if(campCol){try{await campCol.doc(c.id).set(body)}catch{toast("Couldn't save campaign. Try again.")}}
  else{const i=campaigns.findIndex(x=>x.id===c.id);const row={id:c.id,...body};if(i<0)campaigns.push(row);else campaigns[i]=row;localCampSave();renderEncounters()}
}
async function removeCamp(id){
  if(campCol){try{await campCol.doc(id).delete()}catch{toast("Couldn't delete campaign. Try again.");return}}
  else{campaigns=campaigns.filter(x=>x.id!==id);localCampSave()}
  if(campFilter===id)campFilter="all";
  for(const e of encounters.filter(x=>x.campaignId===id))await saveEnc({...e,campaignId:""});
  renderEncounters();
}
// Only one campaign auto-fills at a time; switching it on turns the others off.
async function setAutofill(id,on){
  for(const c of campaigns){const want=on&&c.id===id;if(!!c.autofill!==want)await saveCamp({...c,autofill:want})}
}
const newCampId=()=>"c"+newId().slice(1);

/* ---- encounter list ---- */
function renderEncounters(){
  const ro=READY_OPTS.filter(([k])=>VIS().includes(k));
  $("readyPick").className="stagepick"+(showFile?"":" three");
  $("readyPick").innerHTML=ro.map(([k,v])=>`<button type="button" data-ready="${k}" aria-pressed="${k===effReady()}">${v}</button>`).join("");
  const hasCamps=campaigns.length>0;
  $("encControls").hidden=!hasCamps;
  $("encBm").innerHTML=BM_ICON(bmEnc);$("encBm").setAttribute("aria-pressed",bmEnc);$("encBm").classList.toggle("on",bmEnc);
  if(hasCamps){
    $("encSort").value=encSort;
    if(campFilter!=="all"&&campFilter!=="none"&&!campById(campFilter))campFilter="all";
    $("campFilter").innerHTML=`<option value="all">All campaigns</option>`+[...campaigns].sort(byCampName).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")+`<option value="none">No campaign</option>`;
    $("campFilter").value=campFilter;
  }
  if(!encounters.length){$("encList").innerHTML=`<div class="empty">No encounters yet. Tap <b>+ New encounter</b>, name it, and list the creatures, like “4 goblin”.</div>`;return}
  const list=encounters.filter(e=>(!bmEnc||e.bookmarked)&&(campFilter==="all"||(campFilter==="none"?!campName(e):e.campaignId===campFilter)));
  const newest=(a,b)=>(b.created||0)-(a.created||0);
  const sorters={new:newest,old:(a,b)=>-newest(a,b),name:(a,b)=>a.name.localeCompare(b.name),
    camp:(a,b)=>{const x=campName(a),y=campName(b);if(!x!==!y)return x?-1:1;return x.localeCompare(y)||newest(a,b)}};
  list.sort(sorters[hasCamps?encSort:"new"]);
  if(!list.length){$("encList").innerHTML=bmEnc?`<div class="empty">No bookmarked encounters${campFilter==="all"?"":" in this campaign"}. Tap the bookmark next to an encounter's name to keep it here.</div>`:`<div class="empty">No encounters in this campaign yet.</div>`;return}
  let last=null;
  $("encList").innerHTML=list.map(e=>{
    let head="";
    if(hasCamps&&encSort==="camp"){const g=campName(e)||"No campaign";if(g!==last){last=g;const n=list.filter(x=>(campName(x)||"No campaign")===g).length;head=`<div class="group"><span>${esc(g)}</span><span>${n} encounter${n===1?"":"s"}</span></div>`}}
    const {need,rows,queue,covered,anyHave}=checkEncounter(e);
    const creatures=need.reduce((a,x)=>a+x.n,0);
    const state=!need.length?"none":covered===need.length?"ok":anyHave?"short":"none";
    const status=!need.length?"No creatures":covered===need.length?"Ready":`${covered} of ${need.length} covered`;
    const cn=campName(e);
    return head+`<details class="enc" data-id="${e.id}" ${openEnc.has(e.id)?"open":""}>
      <summary><span class="enc-dot ${state}"></span><span class="enc-name"><span>${esc(e.name)}${e.example?'<span class="tag-ex">Example</span>':""}</span><button class="bm${e.bookmarked?" on":""}" type="button" data-bmenc="${e.id}" aria-pressed="${!!e.bookmarked}" aria-label="Bookmark ${esc(e.name)}">${BM_ICON(e.bookmarked)}</button></span>
        <span class="enc-sum ${state}-t">${status}</span><span class="enc-sub">${cn&&!(encSort==="camp")?`<span class="camp">${esc(cn)}</span>`:""}${creatures} creature${creatures===1?"":"s"} · ${need.length} type${need.length===1?"":"s"}</span></summary>
      <div class="enc-body">
        ${e.notes?`<p class="note" style="margin:0;white-space:pre-line">${esc(e.notes)}</p>`:""}
        <div class="list">${rows.join("")||'<div class="empty">Edit this encounter to add creatures.</div>'}</div>
        ${queue.length?`<h2 style="margin:6px 0 0">Mini's Needed</h2><div class="queue" id="q-${e.id}">${esc(queue.join("\n"))}</div>`:need.length?`<p class="note ok-t" style="margin:0">You're ready for this fight.</p>`:""}
        <div class="row">${queue.length?`<button class="btn" type="button" data-copy="${e.id}">Copy mini list</button>`:""}<button class="btn" type="button" data-editenc="${e.id}">Edit</button></div>
      </div></details>`}).join("");
}

    openSheet(null,{name:info.name||what,size:SIZES[info.size]?info.size:"Medium",type:info.type||"",cr:info.cr||"",tags:[(info.name||what).toLowerCase()],counts:{file:0,printed:0,primed:0,painted:0}});return}
  const ed=e.target.closest("[data-editenc]");if(ed){openEncSheet(encounters.find(x=>x.id===ed.dataset.editenc));return}
  const c=e.target.closest("[data-copy]");if(c){const enc=encounters.find(x=>x.id===c.dataset.copy);const text=checkEncounter(enc).queue.join("\n");
    if(NATIVE){NATIVE.post({t:"copy",text});toast("Copied");return}
    try{await navigator.clipboard.writeText(text);toast("Copied")}catch{const r=document.createRange();r.selectNodeContents($("q-"+enc.id));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it from here.")}}
});

function localEncLoad(){try{encounters=JSON.parse(localStorage.getItem("encounters")||"[]")}catch{encounters=[]}}
function localEncSave(){storeLocal("encounters",encounters)}
async function saveEnc(e){
  const body={name:e.name,lines:e.lines,notes:e.notes||"",campaignId:e.campaignId||"",meta:e.meta||{},bookmarked:!!e.bookmarked,created:e.created||Date.now(),updated:Date.now()};if(e.example)body.example=true;
  if(encCol){try{await encCol.doc(e.id).set(body)}catch(x){toast(x&&x.code==="quota_exceeded"?"Storage is full. Delete some encounters first.":"Couldn't save. Try again.")}}
  else{const i=encounters.findIndex(x=>x.id===e.id);const row={id:e.id,...body};if(i<0)encounters.unshift(row);else encounters[i]=row;localEncSave();renderEncounters()}
}
async function removeEnc(id){
  openEnc.delete(id);
  if(encCol){try{await encCol.doc(id).delete()}catch{toast("Couldn't delete. Try again.")}}
  else{encounters=encounters.filter(x=>x.id!==id);localEncSave();renderEncounters()}
}

/* ---- new / edit encounter ---- */
function openEncSheet(e){
  const isNew=!e;e=e||{id:"e"+newId().slice(1),name:"",lines:"",notes:"",campaignId:autoCamp()?.id||""};
  const current=campById(e.campaignId)?e.campaignId:"";
  sheetShell(isNew?"New encounter":"Edit encounter",`
    <h2 style="margin:0">${isNew?"New encounter":"Edit encounter"}</h2>
    <label for="e-name">Encounter name<input id="e-name" required value="${esc(e.name)}" placeholder="Ambush at the old bridge"></label>
    <label for="e-lines">Creatures, one per line<textarea id="e-lines" placeholder="4 goblin&#10;1 ogre&#10;2 wolf">${esc(e.lines)}</textarea></label>
    <p class="note" style="margin:-6px 0 0">Tip: paste a monster list from a D&amp;D Beyond encounter, or a single stat block (counts as 1), and it converts automatically with CR and creature type.</p>
    <label for="e-notes">Notes<textarea id="e-notes" rows="3" style="min-height:72px" placeholder="Session 6, ogre arrives on round 3">${esc(e.notes||"")}</textarea></label>
    <label for="e-camp">Campaign<select id="e-camp">
      <option value="">No campaign</option>
      ${[...campaigns].sort(byCampName).map(c=>`<option value="${c.id}" ${c.id===current?"selected":""}>${esc(c.name)}${c.autofill?" (auto-fill)":""}</option>`).join("")}
      <option value="__new">+ New campaign…</option></select></label>
    <label for="e-campname" id="e-newwrap" hidden>New campaign name<input id="e-campname" placeholder="Curse of the Drowned Crown"></label>
    <label class="check" for="e-auto" id="e-autowrap" hidden><input type="checkbox" id="e-auto"> Auto-fill new encounters with this campaign</label>
    ${campaigns.length?`<button class="btn quiet" type="button" id="e-manage" style="justify-self:start">Edit or delete campaigns</button>`:""}
    <div class="row" style="justify-content:space-between">
      ${isNew?"<span></span>":`<button class="btn quiet danger" type="button" id="e-del">Delete</button>`}
      <div class="row"><button class="btn quiet" type="button" id="e-cancel">Cancel</button><button class="btn primary" type="submit">${isNew?"Create":"Save"}</button></div>
    </div>
    <p class="note" id="e-confirm" hidden>Delete this encounter? Your minis stay on the shelf. <button class="btn danger" type="button" id="e-del2">Yes, delete</button></p>`);
  const syncCamp=()=>{const v=$("e-camp").value;$("e-newwrap").hidden=v!=="__new";$("e-autowrap").hidden=!v;
    $("e-auto").checked=v&&v!=="__new"?!!campById(v)?.autofill:false;if(v==="__new")$("e-campname").focus()};
  $("e-camp").onchange=syncCamp;syncCamp();
  let meta={...(e.meta||{})};
  $("e-lines").addEventListener("paste",ev=>{const t=ev.clipboardData?.getData("text");const r=parseEncounterPaste(t);if(!r)return;ev.preventDefault();
    const box=$("e-lines");box.value=mergeLines(box.value,r.lines);Object.assign(meta,r.meta);
    toast(r.stat?`Added 1 ${r.name} from its stat block`:`Imported ${r.count} monster type${r.count===1?"":"s"} from D&D Beyond`)});
  $("e-cancel").onclick=closeSheet;
  if($("e-manage"))$("e-manage").onclick=()=>openCampSheet();
  if(!isNew){$("e-del").onclick=()=>$("e-confirm").hidden=false;$("e-del2").onclick=()=>{removeEnc(e.id);closeSheet();toast("Encounter deleted")}}
  $("f").onsubmit=async ev=>{ev.preventDefault();
    const name=$("e-name").value.trim();if(!name)return;
    let campId=$("e-camp").value;const auto=$("e-auto").checked;
    if(campId==="__new"){const cname=$("e-campname").value.trim();
      if(!cname){$("e-campname").focus();toast("Name the new campaign, or pick another option.");return}
      const dup=campaigns.find(c=>c.name.toLowerCase()===cname.toLowerCase());
      if(dup)campId=dup.id;else{campId=newCampId();await saveCamp({id:campId,name:cname,autofill:false,created:Date.now()});if(!campById(campId))campaigns.push({id:campId,name:cname,autofill:false})}}
    if(campId){const c=campById(campId);if(c&&!!c.autofill!==auto)await setAutofill(campId,auto)}
    let lines=$("e-lines").value;let r=parseDDB(lines);
    if(!r&&looksLikeStatBlock(lines)){const sb=parseEncounterPaste(lines);
      // keep any "N creature" lines typed above the pasted stat block
      if(sb){const above=lines.split(/\r?\n/).map(s=>s.trim()).filter(s=>/^\d+\s*[x×]?\s+\S/i.test(s)&&!/^\d+\s*(d\d|ft)/i.test(s));r={...sb,lines:mergeLines(above.join("\n"),sb.lines)}}}
    if(r){lines=r.lines;Object.assign(meta,r.meta)}
    const keep=new Set(parseLines(lines).map(x=>norm(x.what)));for(const k of Object.keys(meta))if(!keep.has(k))delete meta[k];
    const out={...e,name,lines,meta,notes:$("e-notes").value.trim(),campaignId:campId};
    delete out.example;if(isNew)openEnc.add(out.id);saveEnc(out);closeSheet();toast(isNew?"Encounter created":"Saved")};
  if(isNew)$("e-name").focus();
}

/* ---- manage campaigns ---- */
function openCampSheet(){
  const list=[...campaigns].sort(byCampName);
  sheetShell("Campaigns",`
    <h2 style="margin:0">Campaigns</h2>
    <p class="note" style="margin:0">Renaming a campaign updates every encounter filed under it. Only one campaign can auto-fill at a time.</p>
    ${list.length?list.map(c=>{const n=encounters.filter(e=>e.campaignId===c.id).length;return `<div class="campedit" data-cid="${c.id}">
      <label for="cn-${c.id}">Name · ${n} encounter${n===1?"":"s"}<input id="cn-${c.id}" value="${esc(c.name)}"></label>
      <div class="row" style="justify-content:space-between">
        <label class="check" for="ca-${c.id}"><input type="checkbox" id="ca-${c.id}" ${c.autofill?"checked":""}> Auto-fill new encounters</label>
        <button class="btn quiet danger" type="button" data-cdel="${c.id}">Delete</button></div>
      <p class="note" id="cd-${c.id}" hidden>Delete “${esc(c.name)}”? Its ${n} encounter${n===1?"":"s"} will stay, with no campaign. <button class="btn danger" type="button" data-cdel2="${c.id}">Yes, delete</button></p>
    </div>`}).join(""):`<div class="empty">No campaigns yet.</div>`}
    <label for="cn-new">Add a campaign<input id="cn-new" placeholder="New campaign name"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn quiet" type="button" id="c-cancel">Cancel</button><button class="btn primary" type="submit">Save changes</button></div>`);
  $("c-cancel").onclick=closeSheet;
  // auto-fill boxes behave like a choose-one, but can all be off
  $("f").addEventListener("change",ev=>{const t=ev.target;if(t.id?.startsWith("ca-")&&t.checked)$("f").querySelectorAll('input[id^="ca-"]').forEach(x=>{if(x!==t)x.checked=false})});
  $("f").addEventListener("click",async ev=>{
    const d=ev.target.closest("[data-cdel]");if(d){$("cd-"+d.dataset.cdel).hidden=false;return}
    const d2=ev.target.closest("[data-cdel2]");if(d2){const id=d2.dataset.cdel2;const n=campById(id)?.name||"Campaign";await removeCamp(id);d2.closest(".campedit").remove();toast(`${n} deleted`)}
  });
  $("f").onsubmit=async ev=>{ev.preventDefault();
    for(const c of campaigns.slice()){const inp=$("cn-"+c.id);if(!inp)continue;
      const name=inp.value.trim()||c.name;const auto=$("ca-"+c.id).checked;
      if(name!==c.name||!!c.autofill!==auto)await saveCamp({...c,name,autofill:auto})}
    const nn=$("cn-new").value.trim();
    if(nn&&!campaigns.some(c=>c.name.toLowerCase()===nn.toLowerCase()))await saveCamp({id:newCampId(),name:nn,autofill:false,created:Date.now()});
    closeSheet();toast("Campaigns saved")};
}

/* ---- settings ---- */
function applyTheme(){const r=document.documentElement;
  if(themePref==="light"||themePref==="dark"){r.setAttribute("data-theme",themePref);r.dataset.mmTheme="1"}
  else if(r.dataset.mmTheme){r.removeAttribute("data-theme");delete r.dataset.mmTheme}}
let prefsDoc=null;
async function setShowFile(on,{save=true}={}){
  if(showFile===on)return;showFile=on;try{localStorage.setItem("showFile",on?"1":"0")}catch{}
  render();renderEncounters();if($("s-counts"))drawCountPicks();
  if(save)savePrefs();
}
async function savePrefs(){
  try{localStorage.setItem("countPrefs",JSON.stringify({total:countTotal,ready:countReady}))}catch{}
  if(prefsDoc){try{await prefsDoc.set({showFile,countTotal,countReady})}catch{toast("Couldn't sync this setting. It's saved on this device.")}}
}
function drawCountPicks(){
  const opts=[...READY_OPTS.filter(([k])=>VIS().includes(k)),["off","Off"]];const cls="stagepick countpick"+(showFile?"":" four");
  $("s-counts").innerHTML=[["total","Total",countTotal],["ready","Ready",countReady]].map(([key,label,val])=>`
    <div class="countrow"><span>${label}</span><div class="${cls}" data-count="${key}">${opts.map(([k,v])=>`<button type="button" data-v="${k}" aria-pressed="${k===effStage(val)}">${v}</button>`).join("")}</div></div>`).join("");
}
function openSettings(){
  const fileTotal=minis.reduce((a,m)=>a+m.counts.file,0);
  sheetShell("Settings",`
    <h2 style="margin:0">Settings</h2>
    <section class="setting">
      <label class="switchrow" for="s-file"><span><b>Track 3D print files</b><small>Adds a <em>File</em> stage for models you have as files but haven't printed yet. Turn off if you don't 3D print.</small></span>
        <input type="checkbox" role="switch" id="s-file" ${showFile?"checked":""}></label>
      <p class="note" id="s-filenote" style="margin:0" ${!showFile&&fileTotal?"":"hidden"}>${fileTotal} file${fileTotal===1?"":"s"} saved and hidden. They come back if you turn this on again.</p>
    </section>
    <section class="setting">
      <b>Shelf counts</b>
      <small class="note" style="margin:-4px 0 0">Choose which stages count toward the totals at the top of the app.</small>
      <div id="s-counts"></div>
    </section>
    <section class="setting">
      <b>Theme</b>
      <div class="stagepick three" id="s-theme">${[["system","Match device"],["light","Light"],["dark","Dark"]].map(([k,v])=>`<button type="button" data-t="${k}" aria-pressed="${k===themePref}">${v}</button>`).join("")}</div>
    </section>
    <section class="setting">
      <b>About</b>
      <small class="note" style="margin:-4px 0 0">Mini Muster by Cozy Nook Nest. Free, no accounts, no ads, and nothing leaves your device.
        <a href="https://cozy-nook-nest.github.io/mini-muster-web/privacy.html" target="_blank" rel="noopener">Privacy policy</a></small>
    </section>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="button" id="s-done">Done</button></div>`);
  drawCountPicks();
  $("s-counts").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;const key=b.closest("[data-count]").dataset.count;
    if(key==="total")countTotal=b.dataset.v;else countReady=b.dataset.v;drawCountPicks();render();savePrefs()};
  $("s-file").onchange=e=>{setShowFile(e.target.checked);$("s-filenote").hidden=e.target.checked||!fileTotal};
  $("s-theme").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;themePref=b.dataset.t;try{localStorage.setItem("theme",themePref)}catch{};applyTheme();
    $("s-theme").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("s-done").onclick=closeSheet;$("f").onsubmit=e=>{e.preventDefault();closeSheet()};
}
$("openSettings").onclick=openSettings;
applyTheme();

/* ---- tabs ---- */
function show(tab){const enc=tab==="enc";$("v-shelf").hidden=enc;$("v-enc").hidden=!enc;$("tab-shelf").setAttribute("aria-selected",!enc);$("tab-enc").setAttribute("aria-selected",enc);$("add").textContent=enc?"+ New encounter":"+ Add mini"}
$("tab-shelf").onclick=()=>show("shelf");$("tab-enc").onclick=()=>show("enc");

/* ---- boot ---- */
localLoad();render();
localEncLoad();localCampLoad();renderEncounters();
$("storeNote").textContent=(window.MM_NATIVE?"Saved on this device.":"Saved in this browser only.")+" Tap any stage count to move minis between stages.";
(async()=>{
  try{db=window.claude?.use?await window.claude.use("db"):null}catch{db=null}
  if(!db){await initLocalPhotos();render();return}
  try{assets=await window.claude.use("assets")}catch{assets=null}
  prefsDoc=db.doc("prefs/settings");
  prefsDoc.onSnapshot(s=>{const d=s?.data?.();if(!d)return;
    let changed=false;
    if(COUNT_VALS.includes(d.countTotal)&&d.countTotal!==countTotal){countTotal=d.countTotal;changed=true}
    if(COUNT_VALS.includes(d.countReady)&&d.countReady!==countReady){countReady=d.countReady;changed=true}
    if(changed){try{localStorage.setItem("countPrefs",JSON.stringify({total:countTotal,ready:countReady}))}catch{};render();if($("s-counts"))drawCountPicks()}
    if(typeof d.showFile==="boolean")setShowFile(d.showFile,{save:false})},()=>{});
  col=db.collection("minis");
  $("storeNote").textContent="Synced to your account, so it shows up on your phone and computer. Tap any stage count to move minis between stages.";
  col.onSnapshot(snap=>{minis=snap.docs.map(d=>{const n=normalize({id:d.id,...d.data()});if(pending[n.id])n.counts={...pending[n.id]};return n});render();renderEncounters()},()=>{});
  encCol=db.collection("encounters");
  campCol=db.collection("campaigns");
  campCol.onSnapshot(snap=>{campaigns=snap.docs.map(d=>({id:d.id,...d.data()}));renderEncounters()},()=>{});
  encCol.onSnapshot(snap=>{encounters=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));renderEncounters()},()=>{});
})();
</script>
